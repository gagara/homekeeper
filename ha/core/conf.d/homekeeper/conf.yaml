# REST => MQTT: Listens for HA events and publish it's content to MQTT
automation hk_rest_mqtt:
  triggers:
    - trigger: event
      event_type: "hk_status"
  actions:
    - action: mqtt.publish
      data:
        topic: "hk/entity/{{trigger.event.data.id}}"
        payload: "{{ trigger.event.data | tojson }}"

